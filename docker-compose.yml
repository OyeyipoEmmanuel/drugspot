services:
  db:
    image: postgres:16-alpine
    container_name: drugspot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: drugspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drugspot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drugspot-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/drugspot
      AUTH_SECRET: replace-with-a-long-production-secret
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
